# ============================================================================
# Common Configuration for ALL Devices (Dongle + Both Keyboard Halves)
# ============================================================================
# Note: ZMK automatically ignores settings that don't apply to each device:
# - Peripheral-only settings are ignored by the dongle
# - Central-only settings are ignored by keyboard halves
# - USB settings are ignored by battery-powered halves
# - Battery/sleep settings are safely ignored by USB-powered dongle

# ============================================================================
# Display and External Power
# ============================================================================

# CONFIG_ZMK_DISPLAY: Enable/disable display support (e.g., OLED)
# CONFIG_ZMK_EXT_POWER: Enable/disable external power control (RGB, etc.)
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_EXT_POWER=n

# ============================================================================
# BLE Settings (All Devices)
# ============================================================================

# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN: Experimental BLE connection improvements
# Enables faster reconnection and better stability (recommended)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# CONFIG_BT_CTLR_TX_PWR: BLE transmission power
# Options: _MINUS_40, _MINUS_20, _MINUS_16, _MINUS_12, _MINUS_8, _MINUS_4,
#          _0DBM (default), _PLUS_2, _PLUS_3, _PLUS_4, _PLUS_5, _PLUS_6,
#          _PLUS_7, _PLUS_8
# Higher = better range but more battery consumption
# Currently using default 0dBm (commented = default)
# - 0dBm: Good for distances up to 1-2m, best battery life
# - +4dBm: Use if you need 2-3+ meters or have obstacles
# Applies to: Keyboard halves (dongle ignores this)
# CONFIG_BT_CTLR_TX_PWR_PLUS_4=y
# CONFIG_BT_CTLR_TX_PWR_0=y

# ============================================================================
# BLE Peripheral Settings (Keyboard Halves)
# ============================================================================
# These settings are automatically ignored by the dongle

# BLE Connection Intervals - how often keyboard "pings" the dongle
# Values are in units of 1.25ms (e.g., 6 = 6 * 1.25ms = 7.5ms)

# CONFIG_BT_PERIPHERAL_PREF_MIN_INT: Minimum connection interval
# How often keyboard MINIMUM should check connection with dongle
# Lower value = faster response, but higher battery consumption
# Default: 24 (30ms), Current: 6 (7.5ms) - very fast response
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6

# CONFIG_BT_PERIPHERAL_PREF_MAX_INT: Maximum connection interval
# How often keyboard MAXIMUM can check connection with dongle
# Default: 40 (50ms), Current: 12 (15ms) - balanced mode
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# CONFIG_BT_PERIPHERAL_PREF_LATENCY: How many "pings" can be skipped
# Keyboard can skip N connections in a row to save battery
# When keyboard is inactive, it can "sleep" and not respond to pings
# Default: 0 (don't skip), Current: 30 - battery savings during idle
# Example: if interval is 15ms and latency=30, max delay = 450ms
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30

# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION: Require resubscription on reconnection
# n = don't require (faster reconnection after sleep/connection loss)
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ============================================================================
# BLE Central Settings (Dongle)
# ============================================================================
# These settings are automatically ignored by keyboard halves

# CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS: Number of BLE peripherals
# How many keyboard halves the dongle will connect to (2 = left + right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING:
# Central (dongle) fetches battery level from peripherals (keyboard halves)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY:
# Central reports peripheral battery levels to host computer
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ============================================================================
# Battery Monitoring (Keyboard Halves)
# ============================================================================
# Automatically ignored by USB-powered dongle

# CONFIG_ZMK_BATTERY_REPORT_INTERVAL: Battery level reporting interval (seconds)
# How often keyboard half reports battery level to dongle
# Default: 60 seconds, 300 = 5 minutes (less frequent = better battery life).
# 60s keeps the host battery widget reasonably fresh (reports only fire on
# change / at this interval) at negligible power cost.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# ============================================================================
# Power Management - Idle and Sleep (Keyboard Halves)
# ============================================================================
# Automatically ignored by USB-powered dongle

# CONFIG_ZMK_IDLE_TIMEOUT: Time until keyboard enters idle state (milliseconds)
# Idle state: Reduced power consumption, ready to wake quickly
# Default: 30000 (30 seconds), 300000 = 5 minutes
CONFIG_ZMK_IDLE_TIMEOUT=300000

# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT: Time until deep sleep after idle (milliseconds)
# Deep sleep: Very low power, BLE connection maintained but with high latency
# First keypress after sleep may have slight delay
# Default: 900000 (15 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# CONFIG_ZMK_SLEEP: Enable deep sleep mode
# Required for IDLE_SLEEP_TIMEOUT to work
CONFIG_ZMK_SLEEP=y

# ============================================================================
# Keyboard Scan (Debounce) Optimization (Keyboard Halves)
# ============================================================================
# Automatically ignored by dongle (has no keys to scan)

# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS: Debounce time for key press (milliseconds)
# Time to wait before registering a key press (eliminates switch bounce)
# Lower = faster response, but may register ghost presses
# Default: 5ms. 1ms registered double-presses (ghosting) as switches aged,
# so restored to the 5ms default for reliable bounce filtering.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5

# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS: Debounce time for key release (milliseconds)
# Default: 5ms
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ============================================================================
# USB Optimization (Dongle)
# ============================================================================
# Automatically ignored by keyboard halves (wireless only)

# CONFIG_ZMK_USB_BOOT: Enable USB boot protocol support
# Allows keyboard to work in BIOS/bootloader (boot protocol mode)
CONFIG_ZMK_USB_BOOT=y

# ============================================================================
# Logging (Disable for Production)
# ============================================================================

# CONFIG_ZMK_USB_LOGGING: Enable USB CDC ACM logging
# Useful for debugging, but uses memory and power
CONFIG_ZMK_USB_LOGGING=n

# CONFIG_LOG: Enable Zephyr logging system
# Disable to save memory and reduce power consumption
CONFIG_LOG=n

# ============================================================================
# Features
# ============================================================================

# CONFIG_ZMK_MOUSE: Enable mouse/pointing device support
# Required for mouse keys (mmv, msc, mkp behaviors)
CONFIG_ZMK_MOUSE=y
