# ============================================================================
# Right Keyboard Half Configuration (Peripheral)
# ============================================================================
# Note: All other settings are defined in dao.conf
#       This file only defines the split role

# CONFIG_ZMK_SPLIT_ROLE_CENTRAL: Define role in split keyboard
# n = peripheral (keyboard half), y = central (dongle)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
