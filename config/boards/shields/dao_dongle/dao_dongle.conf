# ============================================================================
# Dongle Configuration (Central / USB Host)
# ============================================================================
# Note: All other settings are defined in dao.conf
#       This file only defines the split role

# CONFIG_ZMK_SPLIT_ROLE_CENTRAL: Define role in split keyboard
# y = central (dongle), n = peripheral (keyboard half)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# ============================================================================
# Per-half battery over USB HID (zmk-split-battery-tray)
# ============================================================================
# Second USB HID interface publishing left/right battery to the host, since
# ZMK's BLE battery proxy can't reach a USB-connected host. Consumed by
# config/src/battery_hid.c (gated on CONFIG_ZMK_SPLIT_BATTERY_HID_REPORT).
# FETCHING is the source of the battery events battery_hid.c subscribes to.
# (ZMK_USB/ZMK_BLE already come from the xiao_ble board defconfig.)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Three USB HID interfaces total: keyboard (ZMK) + vendor L/R (HID_1) +
# standard Battery Strength feature report (HID_2, auto-detected by the host).
CONFIG_USB_HID_DEVICE_COUNT=3

# USB manufacturer string. Combined with the product name ("Keyboard") this
# makes the host show the device / battery as "Dao Keyboard".
CONFIG_USB_DEVICE_MANUFACTURER="Dao"

# Distinct BLE identity: without this, BT_DEVICE_NAME inherits the generic
# USB product string "Keyboard" and the dongle is anonymous in BLE scanners.
CONFIG_BT_DEVICE_NAME="Dao Keyboard"
