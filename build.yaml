# This file generates the GitHub Actions matrix
# For Dao keyboard with dongle setup
#
# Dongle: seeeduino_xiao_ble + dao_dongle shield (central)
# Left half: dao_left board (peripheral when using dongle)
# Right half: dao_right board (peripheral)
#
---
include:
  # Dongle (central device)
  # NOTE: must be the ZMK board *variant* `xiao_ble//zmk`, not plain `xiao_ble`.
  # As of Zephyr 4.1, ZMK's board defaults (CONFIG_ZMK_BLE/ZMK_USB) live in the
  # `/zmk` variant. Plain `xiao_ble` builds without BLE — the dongle can't act
  # as BLE central and the halves won't connect.
  - board: xiao_ble//zmk
    shield: dao_dongle
  # Left half - peripheral board variant for dongle
  - board: dao_left
  # Right half - peripheral
  - board: dao_right
  # Settings reset for all devices
  - board: dao_left
    shield: settings_reset
  - board: dao_right
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
